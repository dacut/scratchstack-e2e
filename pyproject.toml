[project]
name = "scratchstack-e2e"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "David Cuthbert", email = "dacut@kanga.org" }]
requires-python = ">=3.14"
dependencies = ["boto3>=1.43.81"]

[project.scripts]
scratchstack-e2e-sweep = "scratchstack_e2e.sweep:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-xdist>=3.8",
    "types-boto3-custom",
    "mypy-boto3-builder>=8.12.0",
    "isort>=9.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["serial: mutates account-wide state; must not run under xdist"]

[tool.uv.sources]
types-boto3-custom = { path = "vendored/types_boto3_custom-1.43.81-py3-none-any.whl" }
